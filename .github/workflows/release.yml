name: release

# Once an immutable release is published nothing can be attached to it. So
# the packages are built from a pushed version tag and attached to a *draft*
# release, which is published by hand after review. Push the tag (git push
# origin 1.2.3) and let this workflow create the draft, or fill one that was
# saved as a draft for the tag. A release published early is still filled
# when GitHub reports it as not immutable.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build packages and a draft release for
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    name: ${{ matrix.name }} package
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 90

    # A package depends on the SONAME-numbered FFmpeg libraries of the release
    # it was built on (libavcodec60 on Ubuntu 24.04, libavcodec61 on Debian 13,
    # libavcodec.so.63 on Fedora 45, …), so each supported release gets its
    # own package, built and verified against that release's own archive: the
    # Fedora RPM is installed with dnf, which resolves its Requires against the
    # real Fedora repositories. Fedora is packaged for its current release only.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            distro: ubuntu
            slug: ubuntu-24.04
            package: deb
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            distro: ubuntu
            slug: ubuntu-26.04
            package: deb
          - name: Debian 13
            image: debian:trixie
            distro: debian
            slug: debian-13
            package: deb
            portable_zip: true
          - name: Fedora 45
            image: fedora:45
            distro: fedora
            slug: fedora-45
            package: rpm

    steps:
      - name: Install git
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y --no-install-recommends git ca-certificates
          else
            dnf install -y git ca-certificates
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Installs the build dependencies, builds, packs the zip and the native
      # package, then installs that package in this container and runs it
      # headless.
      - name: Build, package and verify
        run: bash scripts/nightly-distro-build.sh ${{ matrix.distro }}

      # A tag that predates per-release file names packs every job's .deb as
      # nordstjernen_<version>_<arch>.deb; give it the release it was built
      # on, the way scripts/pack-deb.sh names it now, so the jobs' packages
      # don't overwrite each other on the release. An RPM already carries its
      # release in %{?dist} (nordstjernen-<version>-1.fc45.x86_64.rpm).
      - name: Name the package for its distro release
        shell: bash
        run: |
          shopt -s nullglob
          tag=$(. /etc/os-release && printf '%s%s' "$ID" "$VERSION_ID")
          for deb in dist/*.deb; do
            case "$deb" in
              *"_${tag}_"*) ;;
              *) mv -v "$deb" "${deb%_*}_${tag}_${deb##*_}" ;;
            esac
          done

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.package }}-${{ matrix.slug }}
          path: dist/*.${{ matrix.package }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload portable zip
        if: matrix.portable_zip
        uses: actions/upload-artifact@v7
        with:
          name: linux-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # The Developer ID signed, notarised and stapled .dmg. macos.yml in release
  # mode fails on a missing secret or any signing/notarisation error instead
  # of falling back to an ad-hoc bundle.
  macos:
    name: macOS package
    uses: ./.github/workflows/macos.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      release: true
    secrets: inherit

  # Attaches the Linux packages even when the macOS job failed, so a notary
  # outage does not hold them back, but then fails the run: re-run the failed
  # jobs once macOS is fixed and the .dmg joins the same draft.
  publish:
    name: Attach to a draft release
    needs: [linux, macos]
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: Changelog.md
          sparse-checkout-cone-mode: false

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist

      - name: Download the macOS .dmg
        if: needs.macos.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: nordstjernen-macos-*-dmg
          merge-multiple: true
          path: dist

      - name: Release notes from the changelog
        run: |
          awk -v tag="$TAG" '
            $0 == tag ":" { take = 1; getline; next }
            take && /^[0-9]+\.[0-9]+\.[0-9]+:$/ { exit }
            take { print }
          ' Changelog.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Nordstjernen $TAG" > release-notes.md
          fi

      - name: Create or fill the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          shopt -s nullglob
          packages=(*.deb *.rpm *.zip *.dmg)
          sha256sum -- "${packages[@]}" > SHA256SUMS
          cat SHA256SUMS
          if state=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
                       --jq '"\(.draft) \(.immutable // false)"' 2>/dev/null); then
            if [ "$state" = "false true" ]; then
              echo "::error::Release $TAG is already published. Releases are" \
                   "immutable here, so its packages can no longer be attached." \
                   "Push the tag and let this workflow create the draft, then" \
                   "publish the draft."
              exit 1
            fi
            gh release upload "$TAG" "${packages[@]}" ./SHA256SUMS \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${packages[@]}" ./SHA256SUMS \
              --draft --verify-tag --title "$TAG" \
              --notes-file ../release-notes.md --repo "$GITHUB_REPOSITORY"
          fi
          if [ "${{ needs.macos.result }}" != success ]; then
            echo "::error::The macOS job did not produce a notarised .dmg" \
                 "(${{ needs.macos.result }}); the draft has only the Linux" \
                 "packages. Fix it and re-run the failed jobs before publishing."
            exit 1
          fi
          echo "Draft release $TAG has its packages; review and publish it."
