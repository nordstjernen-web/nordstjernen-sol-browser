name: linux

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler }} on ubuntu-${{ matrix.ubuntu }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['26.04']
        compiler: [clang, gcc]

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's Azure Ubuntu mirror sometimes serves at a few KB/s and
      # the install outran its time limit. Downloaded packages are cached
      # between runs, the download is bounded on its own, and a stalled
      # download is retried against archive.ubuntu.com.
      - name: Restore apt package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-linux-${{ matrix.ubuntu }}-${{ hashFiles('.github/workflows/linux.yml') }}
          restore-keys: |
            apt-linux-${{ matrix.ubuntu }}-

      - name: Install build dependencies
        timeout-minutes: 20
        run: |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            "Dir::Cache::Archives \"$HOME/apt-archives\";" |
            sudo tee /etc/apt/apt.conf.d/80-ci-retries
          mkdir -p ~/apt-archives/partial
          packages="ccache clang gcc pkg-config meson ninja-build
            libgtk-4-dev libepoxy-dev libcurl4-openssl-dev libssl-dev
            libuchardet-dev libpsl-dev libsqlite3-dev
            libwebp-dev libavif-dev libjxl-dev libsdl2-dev libseccomp-dev glslang-dev ca-certificates
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev"
          download() {
            sudo apt-get update &&
              timeout 420 sudo apt-get install -y --download-only $packages
          }
          if ! download; then
            echo "::warning::apt mirror stalled; retrying against archive.ubuntu.com"
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
              /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
            download
          fi
          sudo apt-get install -y $packages
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.compiler }}-

      - name: Configure ccache
        run: |
          ccache --max-size=200M
          ccache --zero-stats

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=ccache gcc" >> $GITHUB_ENV
          else
            echo "CC=ccache clang" >> $GITHUB_ENV
          fi

      - name: Show toolchain versions
        run: |
          clang --version
          ccache --version | head -1
          meson --version
          ninja --version
          pkg-config --modversion gtk4
          pkg-config --modversion libcurl
          pkg-config --modversion libavcodec

      - name: Prefetch wgpu-native through the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prefetch-wrap.sh wgpu-native-linux-x86_64

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          meson setup builddir --werror
          meson compile -C builddir 2>&1 | tee build.log

      - name: ccache stats
        if: always()
        run: command -v ccache >/dev/null && ccache --show-stats || true

      - name: Smoke test (binary present and executable)
        if: hashFiles('builddir/src/gtk/nordstjernen') != ''
        run: |
          test -x builddir/src/gtk/nordstjernen
          file builddir/src/gtk/nordstjernen
          ldd builddir/src/gtk/nordstjernen | head -20

      - name: Headless smoke (about:start + <video> layout)
        if: hashFiles('builddir/src/gtk/nordstjernen') != ''
        run: |
          set -o pipefail
          ./builddir/src/gtk/nordstjernen --headless --dump=text about:start > about.txt
          head -3 about.txt
          grep -q Nordstjernen about.txt
          mkdir -p smoke
          cat > smoke/video.html <<'EOF'
          <!doctype html><video src="x.webm" width="320" height="180"></video>
          EOF
          (cd smoke && python3 -m http.server 18765 >/dev/null 2>&1 &) ; sleep 1
          ./builddir/src/gtk/nordstjernen --headless --dump=layout \
              http://127.0.0.1:18765/video.html \
              | tee /tmp/layout.txt
          grep -q 'video @' /tmp/layout.txt
          pkill -f "http.server 18765" || true

      - name: Headless baseline smoke (./scripts/dev.sh smoke)
        if: hashFiles('builddir/src/gtk/nordstjernen') != ''
        run: ./scripts/dev.sh smoke

      # Verify the engine still compiles under the Android configuration
      # (__ANDROID__) without needing the NDK.
      - name: Android source check (no NDK)
        if: hashFiles('builddir/compile_commands.json') != ''
        run: ./android/scripts/check-android-sources.sh builddir

      - name: Upload build log
        if: always() && hashFiles('build.log') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log-${{ matrix.ubuntu }}-${{ matrix.compiler }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload nordstjernen binary
        if: hashFiles('builddir/src/gtk/nordstjernen') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nordstjernen-linux-${{ matrix.ubuntu }}-${{ matrix.compiler }}
          path: builddir/src/gtk/nordstjernen
          if-no-files-found: error
          retention-days: 14
