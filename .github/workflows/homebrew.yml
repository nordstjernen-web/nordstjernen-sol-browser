name: homebrew

# Points the cask in nordstjernen-web/homebrew-tap at a release's notarised
# macOS .dmg once the release is published. Pushing to the tap needs the
# HOMEBREW_TAP_TOKEN secret: a fine-grained token with Contents read/write
# on nordstjernen-web/homebrew-tap only.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release whose .dmg the cask should install
        required: true

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  cask:
    name: Update the Homebrew cask
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the tap token
        env:
          HAS_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::error::Add the HOMEBREW_TAP_TOKEN repository secret (a" \
                 "fine-grained token with Contents read/write on" \
                 "nordstjernen-web/homebrew-tap) to update the cask."
            exit 1
          fi

      - name: Read the .dmg checksum from the release
        id: dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --output SHA256SUMS
          dmg="nordstjernen-$TAG-macos-arm64.dmg"
          sha=$(awk -v f="$dmg" '$2 == f { print $1 }' SHA256SUMS)
          if [ -z "$sha" ]; then
            echo "::error::$dmg is not listed in the SHA256SUMS of release $TAG"
            exit 1
          fi
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: nordstjernen-web/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump and push the cask
        env:
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          cd tap
          cask=Casks/nordstjernen.rb
          sed -i -E "s/^  version \"[^\"]*\"/  version \"$TAG\"/" "$cask"
          sed -i -E "s/^  sha256 \"[^\"]*\"/  sha256 \"$SHA256\"/" "$cask"
          if git diff --quiet; then
            echo "The cask already installs $TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "nordstjernen $TAG"
          git push
