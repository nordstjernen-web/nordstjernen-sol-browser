name: java

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: JDK 21 on ubuntu-26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install engine build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ccache clang make pkg-config meson ninja-build \
            libgtk-4-dev libepoxy-dev libcurl4-openssl-dev libssl-dev libuchardet-dev \
            libpsl-dev libsqlite3-dev libseccomp-dev libwebp-dev libavif-dev libsdl2-dev glslang-dev ca-certificates \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '9.8.2'

      - name: Show versions
        run: |
          java -version
          gradle --version
          meson --version

      - name: Build native libraries (engine + JNI bridge)
        run: CC="ccache clang" java/scripts/build-native.sh

      - name: Build jar
        working-directory: java
        run: gradle build --no-daemon --stacktrace

      - name: Smoke test (run example via the bundled jar)
        run: |
          set -o pipefail
          # The library jar is the one with no classifier — build/libs also
          # holds the -sources and -javadoc jars, and neither has classes.
          JAR=$(ls java/build/libs/nordstjernen-java-*.jar \
                | grep -Ev -- '-(sources|javadoc)\.jar$' | head -1)
          echo "jar: $JAR"
          mkdir -p out
          javac -cp "$JAR" -d out java/examples/Example.java
          java -Djava.awt.headless=true -cp "$JAR:out" Example about:start | tee smoke.txt
          grep -q Nordstjernen smoke.txt

      - name: Smoke test (browser API against the renderer process)
        run: |
          set -o pipefail
          JAR=$(ls java/build/libs/nordstjernen-java-*.jar \
                | grep -Ev -- '-(sources|javadoc)\.jar$' | head -1)
          javac -cp "$JAR" -d out java/examples/PageExample.java
          javac -cp "$JAR" -d out java/examples/BrowserViewExample.java
          NORDSTJERNEN_RENDERER="$PWD/builddir-java/src/nordstjernen-renderer" \
            java -cp "$JAR:out" PageExample about:start | tee page-smoke.txt
          grep -q 'ok:     true' page-smoke.txt
          grep -q '6 \* 7 = 42' page-smoke.txt

      - name: Smoke test (MCP server drives a headless tab)
        run: |
          set -o pipefail
          JAR=$(ls java/build/libs/nordstjernen-java-*.jar \
                | grep -Ev -- '-(sources|javadoc)\.jar$' | head -1)
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"navigate","arguments":{"url":"about:start"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"read_page","arguments":{"filter":"interactive"}}}' \
            | NORDSTJERNEN_RENDERER="$PWD/builddir-java/src/nordstjernen-renderer" \
                java -cp "$JAR" org.nordstjernen.agent.McpServer --in-memory > mcp-smoke.txt
          cut -c1-400 mcp-smoke.txt
          grep -q '"name":"read_page"' mcp-smoke.txt
          grep -q 'Tab 1: about:start' mcp-smoke.txt
          grep -q 'ref_1' mcp-smoke.txt

      - name: Build jar with Maven
        working-directory: java
        run: |
          mvn -q -B package
          JAR=$(ls target/nordstjernen-java-*.jar \
                | grep -Ev -- '-(sources|javadoc)\.jar$' | head -1)
          unzip -l "$JAR" | grep -q 'org/nordstjernen/browser/Page.class'
          unzip -l "$JAR" | grep -q 'META-INF/License.md'
          unzip -l "$JAR" | grep -q 'org/nordstjernen/agent/McpServer.class'

      - name: Upload jar
        if: hashFiles('java/build/libs/*.jar') != ''
        uses: actions/upload-artifact@v7
        with:
          name: nordstjernen-java
          path: java/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
