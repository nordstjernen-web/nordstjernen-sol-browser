name: musl

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    container: alpine:3.24
    timeout-minutes: 40
    steps:
      - name: Install build dependencies (musl)
        run: |
          # dl-cdn.alpinelinux.org has failed the TLS handshake for the main
          # repository's APKINDEX while serving community's, leaving apk
          # unable to select build-base and the job dead before checkout.
          # The next fetch usually reaches a healthy edge, so retry rather
          # than let one bad CDN node fail the build.
          attempt=0
          until apk add --no-cache \
            build-base clang ccache pkgconf meson ninja git cmake \
            gtk4.0-dev libepoxy-dev curl-dev openssl-dev uchardet-dev libpsl-dev sqlite-dev libwebp-dev libavif-dev sdl2-dev glslang-dev \
            libseccomp-dev ffmpeg-dev libjxl-dev brotli-dev \
            gstreamer-dev gst-plugins-base-dev enchant2-dev libvorbis-dev opusfile-dev \
            fontconfig font-dejavu ca-certificates file nodejs
          do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 4 ]; then
              echo "apk add failed $attempt times; the Alpine package" \
                   "mirror is unreachable. This is a mirror outage, not a" \
                   "build failure."
              exit 1
            fi
            echo "apk add attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.cache/ccache
          key: ccache-musl-${{ github.sha }}
          restore-keys: |
            ccache-musl-

      - name: Configure ccache
        run: |
          ccache --max-size=200M
          ccache --zero-stats

      - name: Build (musl libc)
        run: |
          export CC="ccache clang"
          meson setup builddir
          meson compile -C builddir
          file builddir/src/gtk/nordstjernen

      - name: ccache stats
        if: always()
        run: command -v ccache >/dev/null && ccache --show-stats || true

      - name: Headless smoke test (musl, no X server needed)
        env:
          NS_ALLOW_ROOT: '1'
        run: |
          ldd builddir/src/gtk/nordstjernen | grep -i musl || true
          ./builddir/src/gtk/nordstjernen \
            --headless --url=https://example.com --dump=text > smoke.txt
          head -40 smoke.txt
          grep -qi example smoke.txt
