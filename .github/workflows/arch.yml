name: arch

# Builds, namcap-checks, installs and smoke-tests the Arch package from packaging/arch/ in an Arch container.

on:
  pull_request:
    branches: [main]
    paths:
      - 'packaging/arch/**'
      - '.github/workflows/arch.yml'
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to point the recipe at (empty builds it as committed)
        required: false

concurrency:
  group: arch-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: archlinux:base-devel

    steps:
      - name: Update the system and install the packaging tools
        run: |
          pacman -Syu --noconfirm --needed git namcap pacman-contrib
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Point the recipe at the release tag
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder "$GITHUB_WORKSPACE"
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -u builder packaging/arch/update.sh "$TAG"
          git diff -- packaging/arch

      - name: Check that .SRCINFO matches the PKGBUILD
        run: |
          install -d -o builder /home/builder/pkg
          install -o builder -m644 packaging/arch/PKGBUILD /home/builder/pkg/
          cd /home/builder/pkg
          sudo -u builder makepkg --printsrcinfo > /tmp/srcinfo
          diff -u "$GITHUB_WORKSPACE/packaging/arch/.SRCINFO" /tmp/srcinfo

      - name: Build the package
        working-directory: /home/builder/pkg
        run: sudo -u builder makepkg --syncdeps --noconfirm

      - name: namcap
        working-directory: /home/builder/pkg
        run: |
          namcap PKGBUILD | tee namcap.txt
          namcap nordstjernen-browser-[0-9]*.pkg.tar.zst | tee -a namcap.txt
          if grep -q ' E: ' namcap.txt; then
            echo "namcap reported errors" >&2
            exit 1
          fi

      - name: Install it and run a headless smoke test
        working-directory: /home/builder/pkg
        run: |
          set -o pipefail
          pacman -U --noconfirm nordstjernen-browser-[0-9]*.pkg.tar.zst
          sudo -u builder nordstjernen --headless --dump=text about:start > about.txt
          head -3 about.txt
          grep -q Nordstjernen about.txt

      - name: Collect the recipe and package
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/arch-package"
          cp packaging/arch/PKGBUILD packaging/arch/.SRCINFO "$RUNNER_TEMP/arch-package/"
          cp /home/builder/pkg/nordstjernen-browser-[0-9]*.pkg.tar.zst /home/builder/pkg/namcap.txt \
            "$RUNNER_TEMP/arch-package/" 2>/dev/null || true

      - name: Upload the recipe and package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-package
          path: ${{ runner.temp }}/arch-package/
          include-hidden-files: true
